<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Word Wheel</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
    />
    <style>
      :root {
        --wheel-size: min(340px, 82vw);
      }

      .wheel {
        position: relative;
        width: var(--wheel-size);
        aspect-ratio: 1;
        margin: 0 auto;
      }
      .wheel svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .wheel svg circle {
        fill: #f8f9fa;
        stroke: #adb5bd;
        stroke-width: 0.6;
      }
      .wheel svg line {
        stroke: #ced4da;
        stroke-width: 0.5;
      }

      .tile {
        position: absolute;
        width: 17%;
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: #fff;
        border: 2px solid #0d6efd;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: calc(var(--wheel-size) * 0.08);
        text-transform: uppercase;
        user-select: none;
      }
      .tile.hub {
        width: 20%;
        background: #0d6efd;
        color: #fff;
      }
      .tile.blank {
        border-style: dashed;
        color: #adb5bd;
      }
      .tile.revealed {
        color: #198754;
        border-color: #198754;
        border-style: solid;
      }
    </style>
  </head>
  <body class="bg-light">
    <div class="container py-4" style="max-width: 600px">
      <h1 class="h3 mb-1 text-center">Word Wheel</h1>
      <p class="text-muted text-center mb-4">
        Read the letters sequentially around the wheel to find the hidden word.
      </p>

      <div class="card shadow-sm">
        <div class="card-body text-center py-4">

          <!-- Loading state -->
          <div id="loadingState" class="text-muted my-5">
            <div class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></div>
            Loading today's puzzle…
          </div>

          <!-- No puzzle today -->
          <div id="emptyState" class="d-none my-5">
            <p class="text-muted mb-0">No puzzle scheduled for today. Check back tomorrow!</p>
          </div>

          <!-- Puzzle area -->
          <div id="puzzleArea" class="d-none">
            <div id="wheel" class="wheel">
              <svg viewBox="0 0 100 100" aria-hidden="true"></svg>
            </div>

            <form
              id="guessForm"
              class="mt-4 mx-auto"
              style="max-width: 340px"
              novalidate
            >
              <div class="input-group">
                <input
                  id="guessInput"
                  class="form-control"
                  autocomplete="off"
                  spellcheck="false"
                  placeholder="Type the word"
                  aria-label="Your answer"
                />
                <button class="btn btn-success" type="submit">Check</button>
              </div>
            </form>

            <div class="mt-3 d-flex gap-2 justify-content-center">
              <button
                id="revealBtn"
                class="btn btn-sm btn-outline-secondary"
                type="button"
              >
                Reveal
              </button>
            </div>

            <div
              id="result"
              class="mt-3"
              role="status"
              aria-live="polite"
            ></div>
          </div>

        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
    $(function () {
      const RING_RADIUS = 38;

      const segmenter =
        window.Intl && Intl.Segmenter
          ? new Intl.Segmenter(undefined, { granularity: "grapheme" })
          : null;

      function toChars(text) {
        const normalized = text.normalize("NFC");
        return segmenter
          ? Array.from(segmenter.segment(normalized), (s) => s.segment)
          : Array.from(normalized);
      }

      let puzzle = null;

      function tilePosition(charIndex) {
        if (puzzle.centralCharacter && charIndex === 0) return { x: 50, y: 50 };
        const ringSize = puzzle.centralCharacter
          ? puzzle.chars.length - 1
          : puzzle.chars.length;
        const step = puzzle.direction === "ccw" ? -1 : 1;
        const sequentialIndex = puzzle.centralCharacter ? charIndex - 1 : charIndex;
        const ringIndex =
          puzzle.direction === "random"
            ? puzzle.ringOrder.indexOf(charIndex)
            : sequentialIndex;
        const slot =
          (((puzzle.startSlot + step * ringIndex) % ringSize) + ringSize) %
          ringSize;
        const angle = ((-90 + (slot * 360) / ringSize) * Math.PI) / 180;
        return {
          x: 50 + RING_RADIUS * Math.cos(angle),
          y: 50 + RING_RADIUS * Math.sin(angle),
        };
      }

      function render() {
        const $wheel = $("#wheel");
        $wheel.find(".tile").remove();

        let svg = `<circle cx="50" cy="50" r="${RING_RADIUS}"></circle>`;

        puzzle.chars.forEach((ch, i) => {
          const { x, y } = tilePosition(i);
          if (puzzle.centralCharacter && i > 0) {
            svg += `<line x1="50" y1="50" x2="${x}" y2="${y}"></line>`;
          }

          const isHidden = puzzle.hidden.has(i) && !puzzle.solved;
          const $tile = $('<div class="tile"></div>')
            .toggleClass("hub", puzzle.centralCharacter && i === 0)
            .toggleClass("blank", isHidden)
            .toggleClass("revealed", puzzle.hidden.has(i) && puzzle.solved)
            .css({ left: x + "%", top: y + "%" })
            .text(isHidden ? "?" : ch);
          $wheel.append($tile);
        });

        $wheel.find("svg").html(svg);
      }

      function showResult(type, message) {
        $("#result").html(
          $('<div class="alert py-2 mb-0"></div>')
            .addClass("alert-" + type)
            .text(message)
        );
      }

      // Load today's daily puzzle
      $.ajax({
        url: "api/get_daily.php",
        method: "GET",
        dataType: "json",
      })
        .done(function (res) {
          $("#loadingState").addClass("d-none");

          if (!res || !res.success || !res.puzzle) {
            $("#emptyState").removeClass("d-none");
            return;
          }

          const p = res.puzzle;

          puzzle = {
            chars: p.arrangement,
            direction: p.direction,
            centralCharacter: p.center_letter,
            hiddenCount: p.hidden_count,
            startSlot: p.start_slot,
            ringOrder: p.ring_order,
            hidden: new Set(p.hidden_indexes || []),
            solved: false,
          };

          render();
          $("#puzzleArea").removeClass("d-none");
        })
        .fail(function () {
          $("#loadingState").addClass("d-none");
          $("#emptyState").removeClass("d-none");
        });

      $("#guessForm").on("submit", function (e) {
        e.preventDefault();
        if (!puzzle || puzzle.solved) return;

        const guess = toChars($("#guessInput").val().trim())
          .join("")
          .toLocaleLowerCase();
        if (!guess) return showResult("warning", "Type your answer first.");

        const answer = puzzle.chars.join("").toLocaleLowerCase();
        if (guess === answer) {
          puzzle.solved = true;
          render();
          $("#guessInput").prop("disabled", true);
          showResult("success", "Correct! 🎉");
        } else {
          showResult("danger", "Not quite — try again.");
        }
      });

      $("#revealBtn").on("click", function () {
        if (!puzzle) return;
        puzzle.solved = true;
        render();
        $("#guessInput").prop("disabled", true);
        showResult("secondary", "Answer: " + puzzle.chars.join(""));
      });
    });
    </script>
  </body>
</html>
